# Server Configuration
server.port=5002
# Remove context-path to work with existing frontend

# MongoDB Configuration
mongo.host=${MONGO_HOST:localhost}
mongo.port=${MONGO_PORT:27017}
mongo.db=${MONGO_DB:kindergarten}
mongo.user=${MONGO_USER:}
mongo.password=${MONGO_PASSWORD:}
mongo.authSource=${MONGO_AUTH_SOURCE:admin}
spring.data.mongodb.uri=mongodb://${mongo.user}:${mongo.password}@${mongo.host}:${mongo.port}/${mongo.db}?authSource=${mongo.authSource}

spring.data.mongodb.database=${mongo.db}

# spring.data.mongodb.uri=${MONGODB_URI:mongodb://mongo:27017/kindergarten}
# spring.data.mongodb.database=${DATABASE_NAME:kindergarten}

# Spring Configuration
spring.application.name=teacher-service
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# Logging
logging.level.com.kindergarten=INFO
logging.level.org.springframework.web=INFO