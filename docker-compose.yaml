services:
  nginx:
    build: ./nginx
    container_name: nginx
    restart: no
    ports:
      - "80:80"
    depends_on:
      - frontend
      # - studentservice
      # - teacherservice
      - employeeservice

  frontend:
    build: ./frontend
    container_name: frontend
    restart: no
    ports:
      - "3000:3000"
    depends_on:
      - studentservice
      # - teacherservice
      - employeeservice
  teacherservice:
    build: ./teacherservice
    container_name: teacherservice
    restart: no
    ports:
      - "5002:5002"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: mydb
      MONGO_USER: lovelu
      MONGO_PASSWORD: password123
      MONGO_AUTH_SOURCE: admin
    depends_on:
      - mongo
  studentservice:
    build: ./studentservice
    container_name: studentservice
    restart: no
    ports:
      - "5001:5001"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: mydb
      MONGO_USER: lovelu
      MONGO_PASSWORD: password123
      MONGO_AUTH_SOURCE: admin
    depends_on:
      - mongo
  employeeservice:
    build: ./employeeservice
    container_name: employeeservice
    restart: no
    ports:
      - "5003:5003"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: mydb
      MONGO_USER: lovelu
      MONGO_PASSWORD: password123
      MONGO_AUTH_SOURCE: admin
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: no
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/mongodbschool
    environment:
      MONGO_INITDB_ROOT_USERNAME: lovelu
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: schooldb


volumes:
  mongodb-data:
