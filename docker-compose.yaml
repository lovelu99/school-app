services:
  mongo:
    image: mongo:6
    container_name: mongodb
    restart: no
    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: schooldb


volumes:
  mongodb-data:
